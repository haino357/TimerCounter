<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tally Timerは、残り時間と完了回数がひと目でわかるMacのメニューバータイマーです。">
  <title>Tally Timer | Macのメニューバータイマー</title>
  <link rel="icon" href="../app-icon.png" type="image/png">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app-page">
  <header class="shell app-header">
    <div class="identity app-identity">
      <img src="../app-icon.png" width="128" height="128" alt="">
      <span>Tally Timer</span>
    </div>
    <nav class="app-nav" aria-label="アプリ情報">
      <a href="../">サポート</a>
      <a href="../privacy/">プライバシーポリシー</a>
    </nav>
  </header>

  <main class="shell">
    <section class="app-hero" aria-labelledby="app-headline">
      <div class="app-intro">
        <h1 id="app-headline"><span>残り時間と</span><wbr><span>完了回数を、</span><wbr><span>ひと目で。</span></h1>
        <p>Macのメニューバーからタイマーを開始。作業や勉強を区切って、完了したセットの数を記録できます。</p>
        <a class="contact-link" href="https://github.com/haino357/TimerCounter/releases/latest">Mac版を入手</a>
        <p class="app-requirements">macOS 14以降 · Appleシリコン・Intel対応</p>
      </div>
      <img class="app-preview" src="timer-preview.png" width="1328" height="1472" alt="タイマー実行中の操作パネル。残り18分42秒、完了回数3回の表示例。">
    </section>

    <section class="app-guide" aria-labelledby="app-guide-title">
      <h2 id="app-guide-title">使い方</h2>
      <ol>
        <li>メニューバーのタイマー表示をクリックします。</li>
        <li>「長さ」で1〜180分を選び、「開始」を押します。</li>
        <li>タイマーが終わると、完了回数が1増えます。</li>
      </ol>
    </section>
  </main>

  <footer class="shell">
    <span>開発者 Takayuki Shoji</span>
  </footer>
</body>
</html>
